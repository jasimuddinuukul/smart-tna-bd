<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART TNA BD - ORDER ENTRY SYSTEM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff99">
<script src="pwa-install.js" defer></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body { background:#0f172a; color:white; }

/* ── TOPBAR ── */
.topbar {
  background:#111827;
  padding:12px 20px;
  border-bottom:2px solid #1e293b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:900;
}
.topbar-left  { display:flex; align-items:center; gap:12px; }
.topbar-right { display:flex; align-items:center; gap:10px; }

.back-btn {
  display:flex;
  align-items:center;
  gap:6px;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:8px;
  color:#cbd5e1;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  font-family:Arial,sans-serif;
  transition:all .2s;
}
.back-btn:hover {
  background:#00ff9920;
  color:#00ff99;
  border-color:#00ff99;
}

.page-title {
  font-size:16px;
  font-weight:bold;
  color:#fff;
}

#installBtn {
  display:none;
  align-items:center;
  gap:6px;
  background:#00ff9920;
  border:1px solid #00ff99;
  border-radius:8px;
  color:#00ff99;
  padding:7px 13px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  font-family:Arial,sans-serif;
}
#installBtn:hover { background:#00ff9940; }

.tb-date {
  font-size:11px;
  color:#64748b;
  font-family:monospace;
}

/* ── REST OF ORIGINAL STYLES ── */
header {
  background:#111827;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#00ff99;
  border-bottom:2px solid #1e293b;
}

.container {
  padding:20px;
  max-width:1900px;
  margin:auto;
}

.card {
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

h2 { color:#00ff99; margin-bottom:15px; }

.form-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.form-grid label {
  display:block;
  margin-bottom:6px;
  color:#94a3b8;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

input[type="text"],
input[type="number"],
input[type="date"] {
  width:100%;
  padding:12px;
  border:1px solid #334155;
  border-radius:10px;
  background:#0f172a;
  color:white;
  font-size:14px;
  box-sizing:border-box;
}
input:focus { outline:none; border-color:#00ff99; }
input[readonly] { color:#64748b; cursor:not-allowed; }

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  box-sizing:border-box;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.btn-green  { background:#00aa66; color:white; margin-top:10px; }
.btn-green:hover { background:#008844; }

.color-row {
  display:grid;
  grid-template-columns:2fr 2fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.color-row button {
  background:#dc2626;
  color:white;
  padding:10px;
}
.color-row button:hover { background:#b91c1c; }

table { width:100%; border-collapse:collapse; }
table th, table td {
  border:1px solid #334155;
  padding:10px;
  text-align:center;
  font-size:13px;
}
table th { background:#111827; color:#00ff99; }
table td { vertical-align:middle; }

.table-container { overflow:auto; }

.search-box input {
  background:#111827;
  border:1px solid #334155;
}

.action-btn {
  padding:7px 12px;
  margin:2px;
  width:auto;
  font-size:12px;
  border-radius:8px;
}
.edit-btn   { background:#2563eb; color:white; }
.edit-btn:hover { background:#1d4ed8; }
.delete-btn { background:#dc2626; color:white; }
.delete-btn:hover { background:#b91c1c; }
</style>
</head>
<body>

<!-- ✅ TOPBAR WITH DASHBOARD BACK BUTTON -->
<div class="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="dashboard.html" onclick="return confirmBack(event)">
      🏠 Dashboard
    </a>
    <span class="page-title">📦 Order Entry System</span>
  </div>
  <div class="topbar-right">
    <button id="installBtn" onclick="installPWA()">📲 Install App</button>
    <span class="tb-date" id="dateEl"></span>
  </div>
</div>

<!-- HEADER -->
<header>
  <div style="font-size:20px;margin-bottom:6px;">﷽</div>
  INNOVATIVE KNITEX LTD<br>
  <span style="font-size:16px;font-weight:normal;color:#cbd5e1;">SMART TNA BD - ORDER ENTRY SYSTEM</span>
</header>

<div class="container">

  <!-- NEW ORDER FORM -->
  <div class="card">
    <h2>➕ New Order Entry</h2>
    <div class="form-grid">
      <div><label>Buyer</label><input type="text" id="buyer" placeholder="Buyer Name"></div>
      <div><label>IKL No</label><input type="text" id="ikl" placeholder="IKL Number"></div>
      <div><label>Style</label><input type="text" id="style" placeholder="Style Number"></div>
      <div><label>Item</label><input type="text" id="item" placeholder="Item Name"></div>
      <div><label>Merchandiser</label><input type="text" id="merchandiser" placeholder="Merchandiser Name"></div>
      <div><label>Fabrication</label><input type="text" id="fabrication" placeholder="Fabrication Details"></div>
      <div><label>Order Date</label><input type="date" id="orderDate"></div>
      <div><label>Shipment Date</label><input type="date" id="shipdate"></div>
      <div><label>Lead Time</label><input type="number" id="leadtime" placeholder="Auto Lead Time" readonly></div>
      <div><label>Order Qty</label><input type="number" id="orderQty" placeholder="Auto From Colors" readonly></div>
    </div>

    <br>
    <h2>🎨 Color Breakdown</h2>
    <div id="colorContainer"></div>
    <button class="btn-green" onclick="addColorRow()">➕ Add Color</button>
    <br><br>
    <button class="btn-green" onclick="saveOrder()">💾 Save Order</button>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <h2>🔍 Search Orders</h2>
    <div class="search-box">
      <input type="text" id="searchInput"
        placeholder="Search Buyer / IKL / Style / Item / Merchandiser"
        onkeyup="filterOrders()">
    </div>
  </div>

  <!-- ORDER LIST -->
  <div class="card">
    <h2>📋 Order List</h2>
    <div class="table-container">
      <table id="orderTable">
        <tr>
          <th>Buyer</th><th>IKL No</th><th>Style</th><th>Item</th>
          <th>Merchandiser</th><th>Fabrication</th><th>Order Date</th>
          <th>Shipment Date</th><th>Lead Time</th><th>Order Qty</th>
          <th>Color Breakdown</th><th>Action</th>
        </tr>
      </table>
    </div>
  </div>

</div>

<!-- CONFIRM BACK + DATE -->
<script>
var hasUnsavedData = false;
document.addEventListener("change", function(){ hasUnsavedData = true; });
document.addEventListener("input",  function(){ hasUnsavedData = true; });
function markSaved(){ hasUnsavedData = false; }

window.addEventListener("beforeunload", function(e){
  if(hasUnsavedData){
    e.preventDefault();
    e.returnValue = "Unsaved data আছে। পেজ ছেড়ে যাবেন?";
    return e.returnValue;
  }
});

function confirmBack(e){
  if(hasUnsavedData){
    e.preventDefault();
    var go = confirm(
      "⚠️ Unsaved data আছে!\n\n" +
      "Dashboard এ ফিরে গেলে data হারিয়ে যাবে।\n\n" +
      "তবুও কি Dashboard এ যাবেন?"
    );
    if(go){ hasUnsavedData = false; window.location.href = "dashboard.html"; }
    return false;
  }
  return true;
}

document.getElementById("dateEl").textContent =
  new Date().toLocaleDateString("en-BD",{
    weekday:"short", year:"numeric", month:"short", day:"numeric"
  });
</script>

<!-- FIREBASE (original, unchanged) -->
<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL7l-SkL6ha9FQsnnsQmGpqHg72szd8tQ",
  authDomain: "smart-tna-bd.firebaseapp.com",
  projectId: "smart-tna-bd",
  storageBucket: "smart-tna-bd.firebasestorage.app",
  messagingSenderId: "372049573207",
  appId: "1:372049573207:web:571beae951f9aa4b47fa12"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
let editId = null;

window.addColorRow = function(){
  let div = document.createElement("div");
  div.className = "color-row";
  div.innerHTML = `
    <input type="text"   class="color" placeholder="Color Name">
    <input type="number" class="qty"   placeholder="Quantity" oninput="calculateOrderQty()">
    <button onclick="this.parentElement.remove();calculateOrderQty();">❌ Remove</button>`;
  document.getElementById("colorContainer").appendChild(div);
};

addColorRow();

window.calculateOrderQty = function(){
  let totalQty = 0;
  document.querySelectorAll(".qty").forEach(input=>{ totalQty += Number(input.value)||0; });
  document.getElementById("orderQty").value = totalQty;
};

document.getElementById("orderDate").addEventListener("change", calculateLeadTime);
document.getElementById("shipdate").addEventListener("change", calculateLeadTime);

function calculateLeadTime(){
  let orderDate = document.getElementById("orderDate").value;
  let shipdate  = document.getElementById("shipdate").value;
  if(orderDate && shipdate){
    let diffDays = Math.ceil((new Date(shipdate)-new Date(orderDate))/(1000*60*60*24));
    document.getElementById("leadtime").value = diffDays;
  }
}

window.saveOrder = async function(){
  const buyer        = document.getElementById("buyer").value;
  const ikl          = document.getElementById("ikl").value;
  const style        = document.getElementById("style").value;
  const item         = document.getElementById("item").value;
  const merchandiser = document.getElementById("merchandiser").value;
  const fabrication  = document.getElementById("fabrication").value;
  const orderDate    = document.getElementById("orderDate").value;
  const shipdate     = document.getElementById("shipdate").value;
  const leadtime     = document.getElementById("leadtime").value;
  const orderQty     = document.getElementById("orderQty").value;

  let colors = [];
  document.querySelectorAll(".color-row").forEach(row=>{
    const color = row.querySelector(".color").value;
    const qty   = Number(row.querySelector(".qty").value);
    if(color && qty) colors.push({ color, qty });
  });

  const orderData = {
    buyer, ikl, style, item, merchandiser, fabrication,
    orderDate, shipdate, leadtime, orderQty, colors,
    Merchandising:"Pending", Knitting:"Pending", Dyeing:"Pending",
    Cutting:"Pending", Sewing:"Pending", Finishing:"Pending"
  };

  if(editId){
    await updateDoc(doc(db,"orders",editId), orderData);
    alert("✅ Order Updated Successfully");
    editId = null;
  } else {
    await addDoc(collection(db,"orders"), orderData);
    alert("✅ Order Saved Successfully");
  }
  markSaved();
  clearForm();
  loadOrders();
};

function clearForm(){
  ["buyer","ikl","style","item","merchandiser","fabrication",
   "orderDate","shipdate","leadtime","orderQty"].forEach(id=>{
    document.getElementById(id).value = "";
  });
  document.getElementById("colorContainer").innerHTML = "";
  addColorRow();
}

async function loadOrders(){
  const querySnapshot = await getDocs(collection(db,"orders"));
  let table = document.getElementById("orderTable");
  table.innerHTML = `<tr>
    <th>Buyer</th><th>IKL No</th><th>Style</th><th>Item</th>
    <th>Merchandiser</th><th>Fabrication</th><th>Order Date</th>
    <th>Shipment Date</th><th>Lead Time</th><th>Order Qty</th>
    <th>Color Breakdown</th><th>Action</th>
  </tr>`;
  querySnapshot.forEach(docItem=>{
    const data = docItem.data();
    let colorHtml = "";
    (data.colors||[]).forEach(c=>{ colorHtml += `${c.color} - ${c.qty} PCS<br>`; });
    table.innerHTML += `<tr
      data-search="${data.buyer||""} ${data.ikl||""} ${data.style||""} ${data.item||""} ${data.merchandiser||""} ${data.fabrication||""}">
      <td>${data.buyer||""}</td>
      <td>${data.ikl||""}</td>
      <td>${data.style||""}</td>
      <td>${data.item||""}</td>
      <td>${data.merchandiser||""}</td>
      <td>${data.fabrication||""}</td>
      <td>${data.orderDate||""}</td>
      <td>${data.shipdate||""}</td>
      <td>${data.leadtime||""} Days</td>
      <td>${data.orderQty||0} PCS</td>
      <td style="text-align:left;">${colorHtml}</td>
      <td>
        <button class="action-btn edit-btn"   onclick="editOrder('${docItem.id}')">✏️ Edit</button>
        <button class="action-btn delete-btn" onclick="deleteOrder('${docItem.id}')">🗑️ Delete</button>
      </td>
    </tr>`;
  });
}

window.filterOrders = function(){
  const input = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll("#orderTable tr").forEach((row,index)=>{
    if(index===0) return;
    row.style.display = (row.dataset.search||"").toLowerCase().includes(input) ? "" : "none";
  });
};

window.deleteOrder = async function(id){
  if(confirm("Delete this order?")){ await deleteDoc(doc(db,"orders",id)); alert("🗑️ Order Deleted"); loadOrders(); }
};

window.editOrder = async function(id){
  const querySnapshot = await getDocs(collection(db,"orders"));
  querySnapshot.forEach(docItem=>{
    if(docItem.id !== id) return;
    editId = id;
    const data = docItem.data();
    document.getElementById("buyer").value        = data.buyer||"";
    document.getElementById("ikl").value          = data.ikl||"";
    document.getElementById("style").value        = data.style||"";
    document.getElementById("item").value         = data.item||"";
    document.getElementById("merchandiser").value = data.merchandiser||"";
    document.getElementById("fabrication").value  = data.fabrication||"";
    document.getElementById("orderDate").value    = data.orderDate||"";
    document.getElementById("shipdate").value     = data.shipdate||"";
    document.getElementById("leadtime").value     = data.leadtime||"";
    document.getElementById("orderQty").value     = data.orderQty||"";
    document.getElementById("colorContainer").innerHTML = "";
    (data.colors||[]).forEach(c=>{
      let div = document.createElement("div");
      div.className = "color-row";
      div.innerHTML = `
        <input type="text"   class="color" value="${c.color}">
        <input type="number" class="qty"   value="${c.qty}" oninput="calculateOrderQty()">
        <button onclick="this.parentElement.remove();calculateOrderQty();">❌ Remove</button>`;
      document.getElementById("colorContainer").appendChild(div);
    });
    window.scrollTo({ top:0, behavior:"smooth" });
  });
};

loadOrders();
</script>
</body>
</html>
