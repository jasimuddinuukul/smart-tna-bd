<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body { background:#0f172a; color:white; }

.topbar {
  background:#111827;
  padding:12px 20px;
  border-bottom:2px solid #1e293b;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:900;
}
.topbar-left  { display:flex; align-items:center; gap:12px; }
.topbar-right { display:flex; align-items:center; gap:10px; }

.back-btn {
  display:flex;
  align-items:center;
  gap:6px;
  background:#1e293b;
  border:1px solid #334155;
  border-radius:8px;
  color:#cbd5e1;
  padding:8px 16px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  font-family:Arial,sans-serif;
  transition:all .2s;
}
.back-btn:hover { background:#00ff9920; color:#00ff99; border-color:#00ff99; }

.page-title { font-size:16px; font-weight:bold; color:#fff; }

#installBtn {
  display:none;
  align-items:center;
  gap:6px;
  background:#00ff9920;
  border:1px solid #00ff99;
  border-radius:8px;
  color:#00ff99;
  padding:7px 13px;
  font-size:12px;
  font-weight:700;

}
#installBtn:hover { background:#00ff9940; }
.tb-date { font-size:11px; color:#64748b; font-family:monospace; }

header { background:#111827; padding:20px; text-align:center; border-bottom:2px solid #1e293b; }
.company { font-size:28px; font-weight:bold; color:#00ff99; }
.system  { font-size:18px; margin-top:8px; color:#cbd5e1; }

.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:15px; padding:20px; }
.kpi-card { background:#1e293b; padding:20px; border-radius:15px; text-align:center; }
.kpi-card h2 { color:#00ff99; font-size:28px; margin-bottom:10px; }
.kpi-card p  { color:#cbd5e1; font-size:13px; }

.search-section { padding:20px; }
.search-box { width:100%; padding:14px; border:none; border-radius:10px; background:#1e293b; color:white; font-size:16px; }

.table-wrapper { padding:20px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:#1e293b; }
th {
  background:#111827;
  color:#00ff99;
  padding:10px 8px;
  border:1px solid #334155;
  white-space:nowrap;
  font-size:12px;
}
td {
  padding:8px 6px;
  border:1px solid #334155;
  text-align:center;
  vertical-align:middle;
  white-space:nowrap;
  font-size:12px;
}

.st-pending  { color:#f97316; font-weight:bold; }
.st-running  { color:#3b82f6; font-weight:bold; }
.st-delay    { color:#ef4444; font-weight:bold; }
.st-complete { color:#00ff99; font-weight:bold; }
.st-na       { color:#64748b; }

.edit-btn { background:#00aa66; color:white; border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:12px; }
.edit-btn:hover { background:#008844; }

/* TAB SWITCHER */
.tab-bar {
  display:flex;
  gap:10px;
  padding:0 20px 0;
  margin-bottom:-1px;
}
.tab-btn {
  padding:10px 24px;
  border:2px solid #334155;
  border-bottom:none;
  border-radius:10px 10px 0 0;
  background:#111827;
  color:#64748b;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  transition:all .2s;
}
.tab-btn.active {
  background:#1e293b;
  color:#00ff99;
  border-color:#00ff99;
}

.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,.75); z-index:999; justify-content:center;
  align-items:flex-start; overflow-y:auto; }
.modal-content { background:#1e293b; width:95%; max-width:820px;
  margin:30px auto; padding:25px; border-radius:15px; }
.modal-content h2 { color:#00ff99; margin-bottom:20px; font-size:20px;
  border-bottom:1px solid #334155; padding-bottom:12px; }

.modal-info-box { background:#111827; padding:15px; border-radius:10px;
  margin-bottom:20px; border-left:4px solid #00ff99;
  display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.modal-info-box p    { color:#cbd5e1; font-size:14px; }
.modal-info-box span { color:white; font-weight:bold; }

.section-title { background:#0f172a; color:#00ff99; padding:8px 12px;
  border-radius:8px; font-size:13px; font-weight:bold;
  text-transform:uppercase; letter-spacing:1px;
  margin:18px 0 12px 0; border-left:3px solid #00ff99; }

.form-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px; }

.form-row label { display:block; margin-bottom:6px; color:#94a3b8;
  font-size:12px; font-weight:bold; text-transform:uppercase; letter-spacing:0.5px; }

input[type="date"], input[type="number"], select, textarea {
  width:100%; padding:10px; border:1px solid #334155; border-radius:8px;
  background:#0f172a; color:white; font-size:14px; }
input[type="date"]:focus, select:focus, textarea:focus { outline:none; border-color:#00ff99; }

.status-group { display:flex; gap:8px; }
.status-btn {
  flex:1; padding:11px 6px; border:2px solid #334155; border-radius:8px;
  background:#0f172a; color:#64748b; font-weight:bold; font-size:13px;
  cursor:pointer; transition:all 0.2s; text-align:center; }
.status-btn.active-pending  { border-color:#f97316; background:#431407; color:#f97316; }
.status-btn.active-running  { border-color:#3b82f6; background:#1e3a5f; color:#3b82f6; }
.status-btn.active-delay    { border-color:#ef4444; background:#450a0a; color:#ef4444; }
.status-btn.active-complete { border-color:#00ff99; background:#052e16; color:#00ff99; }

.btn-group { display:flex; gap:10px; margin-top:25px; }
.save-btn  { background:#00aa66; padding:13px 25px; border:none; border-radius:10px;
  color:white; font-weight:bold; cursor:pointer; font-size:15px; flex:1; }
.save-btn:hover  { background:#008844; }
.close-btn { background:#dc2626; padding:13px 25px; border:none; border-radius:10px;
  color:white; font-weight:bold; cursor:pointer; font-size:15px; flex:1; }
.close-btn:hover { background:#b91c1c; }
</style>
</head>
<body>

<!-- KPI -->
<div class="kpi-grid">
  <div class="kpi-card"><h2 id="kTotal">0</h2><p>Total Orders</p></div>
  <div class="kpi-card"><h2 id="kQty">0</h2><p>Total Qty (PCS)</p></div>

    <thead>
      <tr id="tableHead"></tr>

      <button class="close-btn" id="closeBtn">✖ Close</button>

</div>

<!-- CONFIRM BACK + DATE -->
<script>
var hasUnsavedData = false;
document.addEventListener("change", function(){ hasUnsavedData = true; });
document.addEventListener("input",  function(){ hasUnsavedData = true; });
function markSaved(){ hasUnsavedData = false; }

window.addEventListener("beforeunload", function(e){
  if(hasUnsavedData){
    e.preventDefault();
    e.returnValue = "Unsaved data আছে। পেজ ছেড়ে যাবেন?";
    return e.returnValue;
  }
});

function confirmBack(e){
  if(hasUnsavedData){
    e.preventDefault();
    var go = confirm("⚠️ Unsaved data আছে!\n\nDashboard এ ফিরে গেলে data হারিয়ে যাবে।\n\nতবুও কি Dashboard এ যাবেন?");
    if(go){ hasUnsavedData = false; window.location.href = "dashboard.html"; }
    return false;
  }
  return true;
}

document.getElementById("dateEl").textContent =
  new Date().toLocaleDateString("en-BD",{ weekday:"short", year:"numeric", month:"short", day:"numeric" });

// Tab state
var currentTab = "print";
window.switchTab = function(tab){
  currentTab = tab;
  document.getElementById("tabPrint").className = "tab-btn" + (tab==="print"?" active":"");
  document.getElementById("tabEmb").className   = "tab-btn" + (tab==="emb"  ?" active":"");
  if(window._renderOrderList) window._renderOrderList(window._currentOrders||[]);
};
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBL7l-SkL6ha9FQsnnsQmGpqHg72szd8tQ",
  authDomain: "smart-tna-bd.firebaseapp.com",
  projectId: "smart-tna-bd",
  storageBucket: "smart-tna-bd.firebasestorage.app",
  messagingSenderId: "372049573207",
  appId: "1:372049573207:web:571beae951f9aa4b47fa12"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let allOrders          = [];
let selectedDocId      = null;
let selectedColorIndex = null;
let selectedTab        = "print"; // tracks which tab modal was opened from

const STATUS_OPTIONS = [
  { val:"Pending",  label:"🟠 Pending",  cls:"active-pending"  },
  { val:"Running",  label:"🔵 Running",  cls:"active-running"  },
  { val:"Delay",    label:"🔴 Delay",    cls:"active-delay"    },
  { val:"Complete", label:"🟢 Complete", cls:"active-complete" },
];

/* ── Helpers ── */
function getQty(d){
  const f=[d.totalQty,d.qty,d.quantity,d.Qty,d.TotalQty,d.pcs,d.pieces];
  for(const v of f){
    if(v!==undefined&&v!==null&&v!==""){
      const n=parseFloat(String(v).replace(/,/g,""));
      if(!isNaN(n)&&n>0) return n;
    }
  }
  return 0;
}
function getShip(d){
  return d.shipdate||d.shipmentDate||d.shipmentdate||d.ShipmentDate||d.shipDate||"";
}
function autoTarget(orderDate, offsetDays){
  if(!orderDate) return "";
  const d=new Date(orderDate);
  if(isNaN(d)) return "";
  d.setDate(d.getDate()+offsetDays);
  return d.toISOString().split("T")[0];
}
function statusBadge(val){
  if(!val||val==="-") return `<span class="st-na">-</span>`;
  if(val==="Running")  return `<span class="st-running">● Running</span>`;
  if(val==="Delay")    return `<span class="st-delay">● Delay</span>`;
  if(val==="Complete") return `<span class="st-complete">● Complete</span>`;
  return `<span class="st-pending">● Pending</span>`;
}
function statusBtns(field, current){
  return STATUS_OPTIONS.map(opt => {
    const active = (current===opt.val) ? opt.cls : "";
    return `<button type="button" class="status-btn ${active}"
      onclick="selectStatus('${field}','${opt.val}','${opt.cls}',this)">${opt.label}</button>`;
  }).join("");
}
window.selectStatus = function(field, value, activeCls, btn){
  document.getElementById("f_"+field).value = value;
  btn.parentElement.querySelectorAll(".status-btn").forEach(b=>{ b.className="status-btn"; });
  btn.classList.add(activeCls);
};
function progressBar(pct){
  const c=pct>=100?"#00ff99":pct>=60?"#fbbf24":pct>=30?"#f97316":"#f87171";
  return `<div style="display:flex;align-items:center;gap:6px;min-width:110px;">
    <div style="flex:1;height:8px;background:#1e3048;border-radius:4px;overflow:hidden;">
      <div style="width:${pct}%;height:100%;background:${c};border-radius:4px;"></div>
    </div>
    <span style="font-size:11px;font-weight:700;color:${c};min-width:30px;">${pct}%</span>
  </div>`;
}

/* ── Column configs per tab ── */
const TABS = {
  print: {
    label: "🖨️ Print",
    cols: [
      { head:"Panel Rcv Target",    tKey:"prtPanelRcvTarget",   aKey:"prtPanelRcvActual",   sKey:"prtPanelRcvStatus",   offset:55 },
      { head:"Panel Rcv Actual",    tKey:null },
      { head:"Panel Rcv Status",    tKey:null },
      { head:"Print Start Target",  tKey:"prtStartTarget",      aKey:"prtStartActual",      sKey:"prtStartStatus",      offset:57 },
      { head:"Print Start Actual",  tKey:null },
      { head:"Print Start Status",  tKey:null },
      { head:"Print Complete Target",tKey:"prtCompleteTarget",  aKey:"prtCompleteActual",   sKey:"prtCompleteStatus",   offset:62 },
      { head:"Print Complete Actual",tKey:null },
      { head:"Print Complete Status",tKey:null },
    ],
    steps: [
      { label:"📦 Panel Receive",  tField:"prtPanelRcvTarget",  aField:"prtPanelRcvActual",  sField:"prtPanelRcvStatus",  offset:55 },
      { label:"🖨️ Print Start",    tField:"prtStartTarget",     aField:"prtStartActual",     sField:"prtStartStatus",     offset:57 },
      { label:"✅ Print Complete", tField:"prtCompleteTarget",  aField:"prtCompleteActual",  sField:"prtCompleteStatus",  offset:62 },
    ],
    kpiRun:"kPrintRun", kpiDone:"kPrintDone",
    modalTitle:"🖨️ Print Department Update",
  },
  emb: {
    label: "🪡 Embroidery",
    cols: [
      { head:"Panel Rcv Target",       tKey:"embPanelRcvTarget",    aKey:"embPanelRcvActual",    sKey:"embPanelRcvStatus",    offset:55 },
      { head:"Panel Rcv Actual",       tKey:null },
      { head:"Panel Rcv Status",       tKey:null },
      { head:"Design Approval Target", tKey:"embDesignApprTarget",  aKey:"embDesignApprActual",  sKey:"embDesignApprStatus",  offset:53 },
      { head:"Design Approval Actual", tKey:null },
      { head:"Design Approval Status", tKey:null },
      { head:"Emb Start Target",       tKey:"embStartTarget",       aKey:"embStartActual",       sKey:"embStartStatus",       offset:57 },
      { head:"Emb Start Actual",       tKey:null },
      { head:"Emb Start Status",       tKey:null },
      { head:"Emb Complete Target",    tKey:"embCompleteTarget",    aKey:"embCompleteActual",    sKey:"embCompleteStatus",    offset:63 },
      { head:"Emb Complete Actual",    tKey:null },
      { head:"Emb Complete Status",    tKey:null },
    ],
    steps: [
      { label:"📦 Panel Receive",      tField:"embPanelRcvTarget",   aField:"embPanelRcvActual",   sField:"embPanelRcvStatus",   offset:55 },
      { label:"✏️ Design Approval",   tField:"embDesignApprTarget", aField:"embDesignApprActual", sField:"embDesignApprStatus", offset:53 },
      { label:"🪡 Emb Start",         tField:"embStartTarget",      aField:"embStartActual",      sField:"embStartStatus",      offset:57 },
      { label:"✅ Emb Complete",      tField:"embCompleteTarget",   aField:"embCompleteActual",   sField:"embCompleteStatus",   offset:63 },
    ],
    kpiRun:"kEmbRun", kpiDone:"kEmbDone",
    modalTitle:"🪡 Embroidery Department Update",
  }
};

/* ── Build table headers ── */
function buildHeaders(tab){
  const cfg = TABS[tab];
  const baseHeaders = ["SL","Buyer","IKL No","Style No","Total Qty","Fabrication","Color","Color Qty","Merchandiser","Order Date","Ship Date"];
  let html = baseHeaders.map(h=>`<th>${h}</th>`).join("");

  // Only unique step headers (Target / Actual / Status per step)
  cfg.steps.forEach(s=>{
    html += `<th>${s.label}<br><small style="color:#64748b;font-weight:normal;">Target</small></th>`;
    html += `<th>${s.label}<br><small style="color:#64748b;font-weight:normal;">Actual</small></th>`;
    html += `<th>${s.label}<br><small style="color:#64748b;font-weight:normal;">Status</small></th>`;
  });
  html += `<th>Progress</th><th>Action</th>`;
  document.getElementById("tableHead").innerHTML = html;
}

/* ── Load ── */
async function loadOrders(){
  const snap = await getDocs(collection(db,"orders"));
  allOrders  = [];
  snap.forEach(d => allOrders.push({ id:d.id, ...d.data() }));
  renderKPI();
  buildHeaders(currentTab);
  renderOrderList(allOrders);
}

window.filterOrders = function(){
  const kw = document.getElementById("searchInput").value.toLowerCase();
  if(!kw){ renderOrderList(allOrders); return; }
  renderOrderList(allOrders.filter(o =>
    (o.buyer||"").toLowerCase().includes(kw)        ||
    (o.ikl||o.iklNo||"").toLowerCase().includes(kw) ||
    (o.style||o.styleNo||"").toLowerCase().includes(kw) ||
    (o.merchandiser||"").toLowerCase().includes(kw)
  ));
};

/* ── Tab switch hook ── */
window._renderOrderList = function(orders){
  window._currentOrders = orders;
  buildHeaders(currentTab);
  renderOrderList(orders);
};
window._currentOrders = allOrders;

/* ── Open Modal ── */
window.openOrder = function(docId, colorIndex, tab){
  selectedDocId      = docId;
  selectedColorIndex = colorIndex;
  selectedTab        = tab;
  const order = allOrders.find(o=>o.id===docId);
  if(!order) return;

  const c         = order.colors ? order.colors[colorIndex] : null;
  const orderDate = order.orderDate||"";
  const shipDate  = getShip(order);
  const cfg       = TABS[tab];

  document.getElementById("modalTitle").textContent = cfg.modalTitle;

  let formHtml = `
    <div class="modal-info-box">
      <p><span>Style     :</span> ${order.style||order.styleNo||"-"}</p>
      <p><span>Color     :</span> ${c?c.color||"-":"-"}</p>
      <p><span>Buyer     :</span> ${order.buyer||"-"}</p>
      <p><span>Ship Date :</span> ${shipDate||"-"}</p>
    </div>`;

  cfg.steps.forEach(s=>{
    const tVal = (c&&c[s.tField]) || autoTarget(orderDate, s.offset);
    const aVal = (c&&c[s.aField]) || "";
    const sVal = (c&&c[s.sField]) || "Pending";
    formHtml += `
      <div class="section-title">${s.label}</div>
      <div class="form-grid-3">
        <div class="form-row">
          <label>Target <small style="color:#64748b;">(auto·editable)</small></label>
          <input type="date" id="f_${s.tField}" value="${tVal}">
        </div>
        <div class="form-row">
          <label>Actual</label>
          <input type="date" id="f_${s.aField}" value="${aVal}">
        </div>
        <div class="form-row">
          <label>Status</label>
          <div class="status-group">${statusBtns(s.sField, sVal)}</div>
          <input type="hidden" id="f_${s.sField}" value="${sVal}">
        </div>
      </div>`;
  });

  const remarkKey = tab==="print" ? "prtRemark" : "embRemark";
  const remarkVal = (c&&c[remarkKey])||"";
  formHtml += `
    <div class="section-title">📝 Remark</div>
    <div class="form-row">
      <textarea id="f_${remarkKey}" rows="3">${remarkVal}</textarea>
    </div>`;

  document.getElementById("modalFormArea").innerHTML = formHtml;
  document.getElementById("editModal").style.display = "flex";
};

document.getElementById("closeBtn").onclick = function(){
  document.getElementById("editModal").style.display = "none";
};

/* ── Save ── */
document.getElementById("saveBtn").onclick = async function(){
  if(selectedDocId===null) return;
  const order = allOrders.find(o=>o.id===selectedDocId);
  if(!order) return;

  const cfg = TABS[selectedTab];
  const remarkKey = selectedTab==="print" ? "prtRemark" : "embRemark";
  const fields = {};
  cfg.steps.forEach(s=>{
    fields[s.tField] = document.getElementById("f_"+s.tField).value;
    fields[s.aField] = document.getElementById("f_"+s.aField).value;
    fields[s.sField] = document.getElementById("f_"+s.sField).value;
  });
  const remarkEl = document.getElementById("f_"+remarkKey);
  if(remarkEl) fields[remarkKey] = remarkEl.value;

  if(order.colors && order.colors.length){
    const updatedColors = order.colors.map((c,idx)=>{
      if(idx!==selectedColorIndex) return c;
      return { ...c, ...fields };
    });
    try{
      await updateDoc(doc(db,"orders",selectedDocId),{ colors:updatedColors });
      markSaved();
      alert("✅ Saved Successfully!");
      document.getElementById("editModal").style.display="none";
      loadOrders();
    }catch(err){ alert("❌ Save Failed! "+err.message); }
  } else {
    try{
      await updateDoc(doc(db,"orders",selectedDocId), fields);
      markSaved();
      alert("✅ Saved Successfully!");
      document.getElementById("editModal").style.display="none";
      loadOrders();
    }catch(err){ alert("❌ Save Failed! "+err.message); }
  }
};

/* ── KPI ── */
function renderKPI(){
  let tot=0,totalQty=0,prtRun=0,prtDone=0,embRun=0,embDone=0,delayed=0,pctSum=0;
  const today=new Date();
  allOrders.forEach(order=>{
    tot++;
    totalQty+=getQty(order);
    const c0=(order.colors&&order.colors[0])||{};
    const orderDate=order.orderDate||"";

    const gs=(saved,target,offset)=>{
      const t=saved||autoTarget(orderDate,offset);
      const s=target||"Pending";
      if(s==="Complete") return s;
      if(t&&new Date(t)<today&&(!s||s==="Pending")) return "Delayed";
      return s||"Pending";
    };

    const prtS1=gs(c0.prtPanelRcvTarget, c0.prtPanelRcvStatus, 55);
    const prtS2=gs(c0.prtStartTarget,    c0.prtStartStatus,    57);
    const prtS3=gs(c0.prtCompleteTarget, c0.prtCompleteStatus, 62);
    const embS1=gs(c0.embPanelRcvTarget,   c0.embPanelRcvStatus,   55);
    const embS2=gs(c0.embDesignApprTarget, c0.embDesignApprStatus, 53);
    const embS3=gs(c0.embStartTarget,      c0.embStartStatus,      57);
    const embS4=gs(c0.embCompleteTarget,   c0.embCompleteStatus,   63);

    if(prtS2==="Running") prtRun++;
    if(prtS3==="Complete") prtDone++;
    if(embS3==="Running") embRun++;
    if(embS4==="Complete") embDone++;
    if([prtS1,prtS2,prtS3,embS1,embS2,embS3,embS4].some(s=>s==="Delayed")) delayed++;

    const allSteps=[prtS1,prtS2,prtS3,embS1,embS2,embS3,embS4];
    const done=allSteps.filter(s=>s==="Complete").length;
    pctSum+=Math.round((done/allSteps.length)*100);
  });

  document.getElementById("kTotal").innerText    = tot;
  document.getElementById("kQty").innerText      = totalQty.toLocaleString();
  document.getElementById("kPrintRun").innerText = prtRun;
  document.getElementById("kPrintDone").innerText= prtDone;
  document.getElementById("kEmbRun").innerText   = embRun;
  document.getElementById("kEmbDone").innerText  = embDone;
  document.getElementById("kDelayed").innerText  = delayed;
  document.getElementById("kAvg").innerText      = Math.round(pctSum/(tot||1))+"%";
}

/* ── Render Table ── */
function renderOrderList(orders){
  window._currentOrders = orders;
  const body=document.getElementById("orderTableBody");
  body.innerHTML="";
  let serial=1;
  const today=new Date();
  const tab = currentTab;
  const cfg = TABS[tab];

  const getStatus=(saved,target,fallback)=>{
    const s=saved||fallback;
    if(s==="Complete") return "Complete";
    if(target&&new Date(target)<today&&(!s||s==="Pending")) return "Delayed";
    return s||"Pending";
  };

  orders.forEach(order=>{
    const orderDate = order.orderDate||"";
    const shipDate  = getShip(order)||"-";
    const totalQty  = getQty(order);

    const colors = order.colors&&order.colors.length
      ? order.colors
      : [{ fabrication:order.fabrication||"-", color:order.color||"-", qty:totalQty }];

    colors.forEach((c,index)=>{
      const stepStatuses = cfg.steps.map(s=>{
        const t = c[s.tField] || autoTarget(orderDate, s.offset);
        return getStatus(c[s.sField], t, "Pending");
      });

      const done = stepStatuses.filter(s=>s==="Complete").length;
      const pct  = Math.round((done/cfg.steps.length)*100);

      let stageCells = "";
      cfg.steps.forEach((s,i)=>{
        const t = c[s.tField] || autoTarget(orderDate, s.offset);
        const a = c[s.aField] || "-";
        const st= stepStatuses[i];
        stageCells += `<td>${t}</td><td>${a}</td><td>${statusBadge(st)}</td>`;
      });

      body.innerHTML+=`<tr>
        <td>${index===0?serial:""}</td>
        <td style="text-align:left;">${index===0?(order.buyer||"-"):""}</td>
        <td>${index===0?(order.ikl||order.iklNo||"-"):""}</td>
        <td>${index===0?(order.style||order.styleNo||"-"):""}</td>
        <td>${index===0?totalQty.toLocaleString():""}</td>
        <td style="text-align:left;">${c.fabrication||order.fabrication||"-"}</td>
        <td>${c.color||c.colorName||"-"}</td>
        <td>${Number(c.qty||c.colorQty||0).toLocaleString()}</td>
        <td>${index===0?(order.merchandiser||"-"):""}</td>
        <td>${index===0?(orderDate||"-"):""}</td>
        <td>${index===0?shipDate:""}</td>
        ${stageCells}
        <td>${progressBar(pct)}</td>
        <td><button class="edit-btn" onclick="openOrder('${order.id}',${index},'${tab}')">✏️ Edit</button></td>
      </tr>`;
    });
    serial++;
  });
}

loadOrders();
