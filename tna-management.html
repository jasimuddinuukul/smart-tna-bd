<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyBL7l-SkL6ha9FQsnnsQmGpqHg72szd8tQ",
  authDomain: "smart-tna-bd.firebaseapp.com",
  projectId: "smart-tna-bd",
  storageBucket: "smart-tna-bd.firebasestorage.app",
  messagingSenderId: "372049573207",
  appId: "1:372049573207:web:571beae951f9aa4b47fa12"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let allOrders = [];
let selectedDocId = null;


/* =========================================================
   TNA STAGES
========================================================= */

const STAGES = [
  { label:"Fabric Booking",       field:"fabricBooking",      offset:60 },
  { label:"Yarn Inhouse",         field:"yarnInhouse",        offset:55 },
  { label:"Color Swatch",         field:"colorSwatch",        offset:55 },
  { label:"Lab Dip Submit",       field:"labDipSubmit",       offset:50 },
  { label:"Lab Dip Approval",     field:"labDipApproval",     offset:45 },
  { label:"G2 Receive",           field:"g2Receive",          offset:45 },
  { label:"Strike Off Send",      field:"strikeOffSend",      offset:42 },
  { label:"Strike Off Approval",  field:"strikeOffApproval",  offset:38 },

  { label:"Knitting Start",       field:"knittingStart",      offset:55 },
  { label:"Knitting Complete",    field:"knittingComplete",   offset:40 },

  { label:"Dyeing Start",        field:"dyeingStart",        offset:38 },
  { label:"Dyeing Complete",     field:"dyeingComplete",     offset:30 },

  { label:"Sample Fabric",       field:"sampleFabric",       offset:28 },
  { label:"PP Sample Submit",    field:"ppSampleSubmit",     offset:25 },

  { label:"Sewing Trims",        field:"sewingTrims",        offset:25 },
  { label:"Fabric Test Start",   field:"fabricTestStart",    offset:25 },
  { label:"Fabric Test Complete",field:"fabricTestComplete", offset:20 },

  { label:"PP Approval",         field:"ppApproval",         offset:18 },
  { label:"Size Set",            field:"sizeSet",            offset:18 },
  { label:"PP Meeting",          field:"ppMeeting",          offset:15 },

  { label:"Cutting Start",       field:"cuttingStart",       offset:14 },

  { label:"Print Start",         field:"printStart",         offset:12 },
  { label:"Print Complete",      field:"printComplete",      offset:10 },

  { label:"Sewing Input",        field:"sewingInput",        offset:12 },
  { label:"Sewing Start",        field:"sewingStart",        offset:10 },

  { label:"Inline Inspection",   field:"inlineInspection",   offset:7 },

  { label:"Packing Trims",       field:"packingTrims",       offset:7 },

  { label:"Sewing Complete",     field:"sewingComplete",     offset:5 },

  { label:"Finishing Start",     field:"finishingStart",     offset:5 },

  { label:"Packing Start",       field:"packingStart",       offset:4 },

  { label:"Packing Complete",    field:"packingComplete",    offset:3 },

  { label:"Final Inspection",    field:"finalInspection",    offset:2 },

  { label:"Shipment Approval",   field:"shipmentApproval",   offset:1 }
];


const ST_OPTS = [
  {
    val:"Pending",
    label:"🟠 Pending",
    cls:"active-pending"
  },
  {
    val:"Running",
    label:"🔵 Running",
    cls:"active-running"
  },
  {
    val:"Delay",
    label:"🔴 Delay",
    cls:"active-delay"
  },
  {
    val:"Complete",
    label:"🟢 Complete",
    cls:"active-complete"
  }
];


/* =========================================================
   QTY
========================================================= */

function getOrderQty(o) {

  let qty = Number(
    o.totalQty ||
    o.qty ||
    o.orderQty ||
    0
  );

  if (
    !qty &&
    o.colors &&
    Array.isArray(o.colors)
  ) {

    qty = o.colors.reduce(
      (sum, c) =>
        sum + Number(c.qty || 0),
      0
    );
  }

  return qty;
}


/* =========================================================
   DATE
========================================================= */

function addDays(dateStr, days) {

  if (!dateStr) return "";

  const d =
    new Date(dateStr + "T00:00:00");

  d.setDate(
    d.getDate() + days
  );

  return d
    .toISOString()
    .split("T")[0];
}


/* =========================================================
   STATUS BADGE
========================================================= */

function statusBadge(val) {

  if (
    !val ||
    val === "-" ||
    val === ""
  ) {

    return `<span class="st-na">-</span>`;
  }

  if (val === "Running") {

    return `<span class="st-running">
      ● Running
    </span>`;
  }

  if (val === "Delay") {

    return `<span class="st-delay">
      ● Delay
    </span>`;
  }

  if (val === "Complete") {

    return `<span class="st-complete">
      ● Complete
    </span>`;
  }

  return `<span class="st-pending">
    ● Pending
  </span>`;
}


/* =========================================================
   DATE CELL
========================================================= */

function dateCell(target, actual) {

  const t = target || "-";
  const a = actual || "-";

  let cls = "date-normal";

  if (actual && target) {

    cls =
      actual <= target
        ? "date-ok"
        : "date-late";
  }

  return `
    <td>${t}</td>
    <td class="${cls}">
      ${a}
    </td>
  `;
}


/* =========================================================
   STATUS BUTTONS
========================================================= */

function stBtns(field, current) {

  return ST_OPTS.map(o => {

    const active =
      current === o.val
        ? o.cls
        : "";

    return `
      <button
        type="button"
        class="status-btn ${active}"
        onclick="
          selStatus(
            '${field}',
            '${o.val}',
            '${o.cls}',
            this
          )
        "
      >
        ${o.label}
      </button>
    `;

  }).join("");
}


window.selStatus =
function(field, val, cls, btn) {

  const input =
    document.getElementById(
      "f_" + field
    );

  if (input) {
    input.value = val;
  }

  btn.parentElement
    .querySelectorAll(".status-btn")
    .forEach(b => {

      b.className =
        "status-btn";
    });

  btn.classList.add(cls);
};


/* =========================================================
   FIREBASE REAL-TIME LOAD
========================================================= */

function startFirebaseListener() {

  const ordersRef =
    collection(db, "orders");

  console.log(
    "🔥 Connecting to Firebase..."
  );

  onSnapshot(
    ordersRef,

    snapshot => {

      allOrders = [];

      snapshot.forEach(item => {

        allOrders.push({
          id: item.id,
          ...item.data()
        });

      });

      console.log(
        "🔥 Firebase Orders:",
        allOrders.length
      );

      renderKPI();
      renderTable(allOrders);

    },

    error => {

      console.error(
        "🔥 Firebase ERROR:",
        error
      );

      const body =
        document.getElementById(
          "tnaBody"
        );

      body.innerHTML = `
        <tr>
          <td
            colspan="110"
            style="
              padding:40px;
              color:#ef4444;
              font-weight:bold;
              text-align:center;
            "
          >
            ❌ Firebase Error<br><br>
            ${error.message}
          </td>
        </tr>
      `;
    }
  );
}


/* =========================================================
   SEARCH
========================================================= */

window.filterOrders =
function() {

  const kw =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  if (!kw) {

    renderTable(allOrders);
    return;
  }

  const filtered =
    allOrders.filter(o => {

      return (

        String(o.buyer || "")
          .toLowerCase()
          .includes(kw)

        ||

        String(o.ikl || "")
          .toLowerCase()
          .includes(kw)

        ||

        String(o.style || "")
          .toLowerCase()
          .includes(kw)

        ||

        String(
          o.merchandiser ||
          o.Merchandiser ||
          ""
        )
          .toLowerCase()
          .includes(kw)
      );

    });

  renderTable(filtered);
};


/* =========================================================
   KPI
========================================================= */

function renderKPI() {

  let running = 0;
  let completed = 0;
  let delay = 0;
  let progSum = 0;
  let totalQty = 0;

  allOrders.forEach(o => {

    const done =
      STAGES.filter(
        s =>
          o[s.field + "Status"]
          === "Complete"
      ).length;

    const prog =
      Math.round(
        done /
        STAGES.length *
        100
      );

    progSum += prog;

    totalQty +=
      getOrderQty(o);

    if (prog === 100) {

      completed++;

    } else if (prog > 0) {

      running++;
    }

    const hasDelay =
      STAGES.some(
        s =>
          o[s.field + "Status"]
          === "Delay"
      );

    if (hasDelay) {

      delay++;
    }

  });


  document.getElementById(
    "kTotal"
  ).innerText =
    allOrders.length;


  document.getElementById(
    "kRunning"
  ).innerText =
    running;


  document.getElementById(
    "kCompleted"
  ).innerText =
    completed;


  document.getElementById(
    "kDelay"
  ).innerText =
    delay;


  document.getElementById(
    "kAvgProg"
  ).innerText =
    allOrders.length
      ? Math.round(
          progSum /
          allOrders.length
        ) + "%"
      : "0%";


  document.getElementById(
    "kTotalQty"
  ).innerText =
    totalQty.toLocaleString();
}


/* =========================================================
   TABLE
========================================================= */

function renderTable(orders) {

  const body =
    document.getElementById(
      "tnaBody"
    );

  body.innerHTML = "";

  if (!orders.length) {

    body.innerHTML = `
      <tr>
        <td
          colspan="110"
          style="
            padding:30px;
            color:#64748b;
          "
        >
          No Firebase order data found.
        </td>
      </tr>
    `;

    return;
  }


  let sl = 1;


  orders.forEach(o => {

    const shipDate =
      o.shipdate ||
      o.shipDate ||
      o.shipmentDate ||
      "";

    const orderDate =
      o.orderDate ||
      "";


    let leadTime = "-";


    if (
      orderDate &&
      shipDate
    ) {

      leadTime =
        Math.max(
          0,

          Math.ceil(

            (
              new Date(
                shipDate +
                "T00:00:00"
              )

              -

              new Date(
                orderDate +
                "T00:00:00"
              )

            ) / 86400000

          )

        ) + " Days";
    }


    const qty =
      getOrderQty(o);


    const done =
      STAGES.filter(
        s =>
          o[s.field + "Status"]
          === "Complete"
      ).length;


    const prog =
      Math.round(
        done /
        STAGES.length *
        100
      );


    const hasDelay =
      STAGES.some(
        s =>
          o[s.field + "Status"]
          === "Delay"
      );


    let finalSt =
      "Pending";


    if (prog === 100) {

      finalSt =
        "Complete";

    } else if (hasDelay) {

      finalSt =
        "Delay";

    } else if (prog > 0) {

      finalSt =
        "Running";
    }


    let stageCells = "";


    STAGES.forEach(s => {

      let target = "-";


      if (shipDate) {

        target =
          addDays(
            shipDate,
            -s.offset
          );


        if (
          o[s.field + "Target"]
        ) {

          target =
            o[s.field + "Target"];
        }
      }


      const actual =
        o[s.field + "Actual"] ||
        "-";


      const status =
        o[s.field + "Status"] ||
        "Pending";


      stageCells +=
        dateCell(
          target,
          actual
        )

        +

        `<td>
          ${statusBadge(status)}
        </td>`;
    });


    body.innerHTML += `

      <tr>

        <td>${sl++}</td>

        <td>
          ${o.buyer || "-"}
        </td>

        <td>
          ${o.ikl || "-"}
        </td>

        <td>
          ${o.style || "-"}
        </td>

        <td
          style="
            color:
              ${qty > 0
                ? "#00ff99"
                : "#ef4444"};
            font-weight:bold;
          "
        >
          ${
            qty > 0
              ? qty.toLocaleString()
              : "⚠ 0"
          }
        </td>

        <td>
          ${orderDate || "-"}
        </td>

        <td>
          ${shipDate || "-"}
        </td>

        <td>
          ${leadTime}
        </td>

        <td>
          ${
            o.merchandiser ||
            o.Merchandiser ||
            "-"
          }
        </td>

        <td>

          ${prog}%

          <div class="prog-wrap">

            <div
              class="prog-bar"
              style="
                width:${prog}%
              "
            ></div>

          </div>

        </td>

        ${stageCells}

        <td>
          ${statusBadge(finalSt)}
        </td>

        <td>

          <button
            class="edit-btn"
            onclick="
              openModal('${o.id}')
            "
          >
            ✏️ Edit
          </button>

        </td>

      </tr>
    `;
  });
}


/* =========================================================
   OPEN EDIT MODAL
========================================================= */

window.openModal =
function(docId) {

  selectedDocId =
    docId;


  const o =
    allOrders.find(
      x => x.id === docId
    );


  if (!o) return;


  const shipDate =
    o.shipdate ||
    o.shipDate ||
    "";


  const orderDate =
    o.orderDate ||
    "";


  const GROUPS = [

    {
      title:"🎨 Pre-Production",
      fields:
        STAGES.slice(0,8)
    },

    {
      title:"🧶 Knitting & Dyeing",
      fields:
        STAGES.slice(8,12)
    },

    {
      title:"🧪 Sample & Testing",
      fields:
        STAGES.slice(12,20)
    },

    {
      title:"✂️ Cutting & Sewing",
      fields:
        STAGES.slice(20,28)
    },

    {
      title:"📦 Finishing & Packing",
      fields:
        STAGES.slice(28,33)
    }

  ];


  let formHtml = `

    <div class="modal-info-box">

      <p>
        <span>Style :</span>
        ${o.style || "-"}
      </p>

      <p>
        <span>Buyer :</span>
        ${o.buyer || "-"}
      </p>

      <p>
        <span>IKL :</span>
        ${o.ikl || "-"}
      </p>

      <p>
        <span>Order Date :</span>
        ${orderDate || "-"}
      </p>

      <p>
        <span>Ship Date :</span>
        ${shipDate || "-"}
      </p>

      <p>
        <span>Merchandiser :</span>
        ${
          o.merchandiser ||
          o.Merchandiser ||
          "-"
        }
      </p>

    </div>
  `;


  GROUPS.forEach(grp => {

    formHtml += `

      <div class="section-title">
        ${grp.title}
      </div>
    `;


    grp.fields.forEach(s => {

      let autoTarget = "";


      if (shipDate) {

        autoTarget =
          addDays(
            shipDate,
            -s.offset
          );
      }


      const savedTarget =
        o[s.field + "Target"] ||
        autoTarget;


      const actual =
        o[s.field + "Actual"] ||
        "";


      const status =
        o[s.field + "Status"] ||
        "Pending";


      formHtml += `

        <div
          style="
            background:#111827;
            border-radius:10px;
            padding:14px;
            margin-bottom:10px;
          "
        >

          <div
            style="
              color:#00ff99;
              font-size:13px;
              font-weight:bold;
              margin-bottom:10px;
            "
          >
            ${s.label}
          </div>


          <div class="form-grid-3">

            <div class="form-row">

              <label>
                Target
                <span class="auto-note">
                  (auto·editable)
                </span>
              </label>

              <input
                type="date"
                id="f_${s.field}Target"
                value="${savedTarget}"
              >

            </div>


            <div class="form-row">

              <label>
                Actual
              </label>

              <input
                type="date"
                id="f_${s.field}Actual"
                value="${actual}"
              >

            </div>


            <div class="form-row">

              <label>
                Status
              </label>

              <div class="status-group">

                ${stBtns(
                  s.field + "Status",
                  status
                )}

              </div>


              <input
                type="hidden"
                id="f_${s.field}Status"
                value="${status}"
              >

            </div>

          </div>

        </div>
      `;
    });

  });


  document.getElementById(
    "modalFormArea"
  ).innerHTML =
    formHtml;


  document.getElementById(
    "editModal"
  ).style.display =
    "flex";
};


/* =========================================================
   CLOSE MODAL
========================================================= */

document.getElementById(
  "closeBtn"
).onclick = () => {

  document.getElementById(
    "editModal"
  ).style.display =
    "none";
};


/* =========================================================
   SAVE TO FIRESTORE
========================================================= */

document.getElementById(
  "saveBtn"
).onclick =
async () => {

  if (!selectedDocId) {

    alert(
      "❌ No order selected."
    );

    return;
  }


  const updateData = {};


  STAGES.forEach(s => {

    const target =
      document.getElementById(
        "f_" +
        s.field +
        "Target"
      );


    const actual =
      document.getElementById(
        "f_" +
        s.field +
        "Actual"
      );


    const status =
      document.getElementById(
        "f_" +
        s.field +
        "Status"
      );


    updateData[
      s.field + "Target"
    ] =
      target
        ? target.value
        : "";


    updateData[
      s.field + "Actual"
    ] =
      actual
        ? actual.value
        : "";


    updateData[
      s.field + "Status"
    ] =
      status
        ? status.value
        : "Pending";

  });


  try {

    console.log(
      "💾 Saving:",
      selectedDocId,
      updateData
    );


    await updateDoc(

      doc(
        db,
        "orders",
        selectedDocId
      ),

      updateData
    );


    console.log(
      "✅ Firestore SAVE successful"
    );


    alert(
      "✅ Saved Successfully to Firebase!"
    );


    document.getElementById(
      "editModal"
    ).style.display =
      "none";


  } catch (err) {

    console.error(
      "❌ SAVE ERROR:",
      err
    );


    alert(
      "❌ Firebase Save Failed!\n\n" +
      err.message
    );
  }

};


/* =========================================================
   START
========================================================= */

console.log(
  "🚀 SMART TNA BD started"
);

console.log(
  "📁 Firestore collection: orders"
);

startFirebaseListener();

</script>
